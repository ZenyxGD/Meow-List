<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Nível - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 500px; padding: 28px; margin-top: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
    input, select, textarea { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; font-size: 0.95rem; width: 100%; outline: none; }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    button { background: var(--accent-blue); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; }
    a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
    .guest-banner { background: #1e293b; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .rules-box { background: #0b111e; border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
    .rules-box b { color: var(--text-main); }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
    <h2>Enviar Nível - Meow List</h2>
    
    <div class="rules-box">
      <b>Regras de Envio:</b><br>
      1. Apenas levels feitos por fãs do Meow<br>
      2. Por favor, dê um pouco de esforço<br>
      3. Sem spam de levels<br>
      Obrigado
    </div>

    <div id="userStatusBanner" class="guest-banner" style="display:none;">
      <span id="userStatusText">Modo Convidado</span>
      <a href="CadastroLogin.html" style="margin:0; color: var(--accent-blue);">Entrar/Criar Conta</a>
    </div>

    <form id="levelForm" style="margin-top: 15px;">
      <div class="form-group">
        <label>Nome do Nível</label>
        <input type="text" id="levelName" required placeholder="Ex: Bloodlust">
      </div>

      <div class="form-group">
        <label>Criador(es)</label>
        <input type="text" id="levelCreator" required placeholder="Ex: Manix645 & more">
      </div>

      <div class="form-group">
        <label>ID do Nível no Geometry Dash</label>
        <input type="text" id="gdId" required placeholder="Ex: 12345678">
      </div>

      <div class="form-group">
        <label>Verificador</label>
        <input type="text" id="levelVerifier" required placeholder="Ex: Knobbelboy ou ???">
      </div>

      <div class="form-group">
        <label>Lista Destino</label>
        <select id="listType" required>
          <option value="LPDM">LPDM ( Levels Possíveis Dedicados ao Meow )</option>
          <option value="LIDM">LIDM ( Levels Impossíveis Dedicados ao Meow )</option>
          <option value="LLBDM">LLBDM ( Levels Luck Based Dedicados ao Meow )</option>
        </select>
      </div>

      <div class="form-group">
        <label>Modo de Jogo</label>
        <select id="gameMode" required>
          <option value="classico">Clássico</option>
          <option value="plataforma">Plataforma</option>
          <option value="challenge">Challenge</option>
        </select>
      </div>

      <div class="form-group">
        <label>Link da Showcase (Obrigatório - Apenas YouTube)</label>
        <input type="text" id="showcaseUrl" required placeholder="Ex: https://www.youtube.com/watch?v=... ou https://youtu.be/...">
      </div>

      <div class="form-group">
        <label>Descrição (Opcional)</label>
        <textarea id="levelDescription" placeholder="Escreva uma breve descrição sobre o level..."></textarea>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="hasNong" onchange="toggleNongInput()">
        <label for="hasNong" style="color: #fff; cursor: pointer;">Este nível possui música NONG?</label>
      </div>

      <div class="form-group" id="nongGroup" style="display: none;">
        <label>Nome da Música NONG</label>
        <input type="text" id="nongName" placeholder="Ex: Creo - Sphere (NONG Mix)">
      </div>

      <button type="submit" id="btnSubmit"><i class="fa-solid fa-paper-plane"></i> Enviar Nível</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuthStatus() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const banner = document.getElementById('userStatusBanner');
      const text = document.getElementById('userStatusText');
      banner.style.display = 'flex';
      
      if (session) {
        let username = session.user.user_metadata.username;
        if (!username) {
          const { data: profile } = await supabaseClient
            .from('profiles')
            .select('username')
            .eq('id', session.user.id)
            .single();
          if (profile && profile.username) username = profile.username;
        }
        text.innerHTML = `Logado como: <b>${username || session.user.email}</b>`;
      } else {
        text.innerHTML = `Modo Convidado (Envios permitidos)`;
      }
    }
    checkAuthStatus();

    function toggleNongInput() {
      const checked = document.getElementById('hasNong').checked;
      const nongGroup = document.getElementById('nongGroup');
      const nongInput = document.getElementById('nongName');
      nongGroup.style.display = checked ? 'flex' : 'none';
      if (checked) nongInput.setAttribute('required', 'required');
      else { nongInput.removeAttribute('required'); nongInput.value = ''; }
    }

    function isValidYouTubeUrl(url) {
      const regExp = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+$/;
      return regExp.test(url);
    }

    document.getElementById('levelForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const showcaseUrl = document.getElementById('showcaseUrl').value.trim();
      if (!isValidYouTubeUrl(showcaseUrl)) {
        alert("Por favor, insira um link válido do YouTube para a showcase.");
        return;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const gdId = document.getElementById('gdId').value.trim();
      const name = document.getElementById('levelName').value.trim();
      const creator = document.getElementById('levelCreator').value.trim();
      const verifier = document.getElementById('levelVerifier').value.trim();
      const listType = document.getElementById('listType').value;
      const gameMode = document.getElementById('gameMode').value; // 'classico', 'plataforma', 'challenge'
      const isPlatformer = (gameMode === 'plataforma');
      const description = document.getElementById('levelDescription').value.trim() || null;
      const hasNong = document.getElementById('hasNong').checked;
      const nongName = document.getElementById('nongName').value.trim();
      const btn = document.getElementById('btnSubmit');

      btn.textContent = "Enviando dados...";
      btn.disabled = true;

      try {
        const { error: dbError } = await supabaseClient.from('levels').insert({
          gd_id: gdId,
          name: name,
          creator: creator,
          verifier: verifier,
          list_type: listType,
          game_mode: gameMode,
          is_platformer: isPlatformer,
          showcase_url: showcaseUrl,
          video_url: showcaseUrl,
          description: description,
          has_nong: hasNong,
          nong_name: hasNong ? nongName : null,
          submitted_by: session ? session.user.id : null
        });

        if (dbError) throw dbError;

        alert("Nível enviado com sucesso! Aguarde a moderação.");
        this.reset();
        toggleNongInput();
      } catch (err) {
        alert("Erro no envio: " + err.message);
      } finally {
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Nível';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
