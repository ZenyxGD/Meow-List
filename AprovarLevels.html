<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Mod/Admin - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg-color: #0b111e; --card-bg: #131c2e; --card-border: #1d2b45; --text-main: #e2e8f0; --accent-blue: #3b82f6; --accent-red: #ef4444; --accent-green: #22c55e; --text-muted: #8493a8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 950px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 160px; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
    .list-container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    input.pos-input { background: #0b111e; border: 1px solid var(--card-border); color: #fff; padding: 6px; border-radius: 4px; width: 60px; text-align: center; font-weight: bold; }
    button { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; }
    .btn-approve { background: var(--accent-green); }
    .btn-delete { background: var(--accent-red); }
    .btn-update { background: var(--accent-blue); }
    .btn-video { background: #1e293b; color: var(--accent-blue); border: 1px solid var(--card-border); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Painel de Moderação</h1>
      <small id="userRoleBadge" style="color: var(--accent-blue); font-weight: bold;"></small>
    </div>
    <a href="index.html" style="color: var(--text-muted); text-decoration: none;">← Voltar ao Início</a>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pending_levels')">Níveis Pendentes</button>
    <button class="tab-btn" onclick="switchTab('approved_levels')">Níveis Aprovados</button>
    <button class="tab-btn" onclick="switchTab('pending_records')">Records Pendentes</button>
    <button class="tab-btn" onclick="switchTab('approved_records')">Records Aprovados</button>
  </div>

  <main class="list-container" id="adminContainer"></main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentMode = 'pending_levels';
    let currentUserRole = 'user';

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchUserRole();
      loadView(currentMode);
    });

    async function fetchUserRole() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .single();
        if (profile) {
          currentUserRole = profile.role;
          document.getElementById('userRoleBadge').textContent = `Cargo: ${currentUserRole.toUpperCase()}`;
        }
      }
    }

    function switchTab(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadView(mode);
    }

    async function loadView(mode) {
      const container = document.getElementById('adminContainer');
      container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Carregando...</p>';

      if (mode === 'pending_levels') {
        const { data } = await supabaseClient.from('levels').select('*').eq('meow_status', 'pending');
        renderLevels(data, true);
      } else if (mode === 'approved_levels') {
        const { data } = await supabaseClient.from('levels').select('*').eq('meow_status', 'approved').order('position');
        renderLevels(data, false);
      } else if (mode === 'pending_records') {
        const { data } = await supabaseClient.from('records').select('*, levels(name, creator, gd_id)').eq('status', 'pending');
        renderRecords(data, true);
      } else if (mode === 'approved_records') {
        const { data } = await supabaseClient.from('records').select('*, levels(name, creator, gd_id)').eq('status', 'approved');
        renderRecords(data, false);
      }
    }

    function renderLevels(levels, isPending) {
      const container = document.getElementById('adminContainer');
      if (!levels || levels.length === 0) { container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Nenhum nível nesta seção.</p>'; return; }
      container.innerHTML = '';
      
      const isAdmin = currentUserRole === 'admin';

      levels.forEach(lvl => {
        const showcaseLink = lvl.showcase_url || lvl.video_url || null;
        const isPlat = (lvl.is_platformer === true || lvl.game_mode === 'platformer');
        const modeLabel = isPlat ? 'plat.' : 'clas.';

        container.innerHTML += `
          <div class="card">
            <div>
              <strong>${lvl.name}</strong> (${lvl.gd_id}) <span style="color:var(--accent-blue)">[${lvl.list_type}]</span> <span style="color:var(--text-muted); font-size: 0.8rem;">[${modeLabel}]</span><br>
              <small style="color:var(--text-muted)">Criador: ${lvl.creator} | Verificador: ${lvl.verifier} ${!isPending ? `| Posição Atual: #${lvl.position || '-'}` : ''}</small>
            </div>
            <div class="actions">
              ${showcaseLink ? `
                <a href="${showcaseLink}" target="_blank" class="btn-video"><i class="fa-solid fa-play"></i> Showcase</a>
              ` : ''}

              ${isPending ? `
                <input type="number" id="pos-${lvl.id}" class="pos-input" value="1" min="1">
                <button class="btn-approve" onclick="approveLevel('${lvl.id}')"><i class="fa-solid fa-check"></i> Aprovar</button>
                <button class="btn-delete" onclick="deleteLevel('${lvl.id}')"><i class="fa-solid fa-xmark"></i> Recusar</button>
              ` : `
                ${isAdmin ? `
                  <input type="number" id="pos-${lvl.id}" class="pos-input" value="${lvl.position || 1}" min="1">
                  <button class="btn-update" onclick="updatePosition('${lvl.id}', ${lvl.position || 1})"><i class="fa-solid fa-arrows-up-down"></i> Alterar Posição</button>
                ` : ''}
                <button class="btn-delete" onclick="deleteLevel('${lvl.id}')"><i class="fa-solid fa-trash"></i> Remover</button>
              `}
            </div>
          </div>
        `;
      });
    }

    function renderRecords(records, isPending) {
      const container = document.getElementById('adminContainer');
      if (!records || records.length === 0) { container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Nenhum record nesta seção.</p>'; return; }
      container.innerHTML = '';
      records.forEach(rec => {
        const lvlName = rec.levels ? rec.levels.name : 'Nível Removido';
        const creator = rec.levels ? rec.levels.creator : 'Desconhecido';
        const gdId = rec.levels ? rec.levels.gd_id : '?';

        container.innerHTML += `
          <div class="card">
            <div>
              <strong>${rec.player_name}</strong> - <span style="color:var(--accent-green); font-weight:bold;">${lvlName} ${rec.progress}%</span><br>
              <small style="color:var(--text-muted)">Criador: ${creator} | ID: ${gdId}</small>
            </div>
            <div class="actions">
              <a href="${rec.video_url}" target="_blank" class="btn-video"><i class="fa-solid fa-play"></i> Ver Prova</a>
              ${isPending ? `
                <button class="btn-approve" onclick="approveRecord('${rec.id}')"><i class="fa-solid fa-check"></i> Aprovar</button>
                <button class="btn-delete" onclick="deleteRecord('${rec.id}')"><i class="fa-solid fa-xmark"></i> Recusar</button>
              ` : `
                <button class="btn-delete" onclick="deleteRecord('${rec.id}')"><i class="fa-solid fa-trash"></i> Remover suspeito</button>
              `}
            </div>
          </div>
        `;
      });
    }

    async function approveLevel(id) {
      const targetPos = parseInt(document.getElementById(`pos-${id}`).value, 10);

      if (isNaN(targetPos) || targetPos < 1) {
        alert("Insira uma posição válida.");
        return;
      }

      const { error } = await supabaseClient.rpc('approve_level_with_pos', {
        p_level_id: id,
        p_target_pos: targetPos
      });

      if (error) {
        alert("Erro ao aprovar nível: " + error.message);
      } else {
        alert("Nível aprovado com sucesso!");
        loadView('pending_levels');
      }
    }

    async function updatePosition(id, currentPos) {
      if (currentUserRole !== 'admin') {
        alert("Apenas ADMINS podem alterar a posição de níveis já aprovados.");
        return;
      }

      const newPos = parseInt(document.getElementById(`pos-${id}`).value, 10);

      if (isNaN(newPos) || newPos < 1) {
        alert("Insira uma posição válida.");
        return;
      }

      if (newPos === currentPos) return;

      const { error } = await supabaseClient.rpc('update_level_position', {
        p_level_id: id,
        p_new_pos: newPos
      });

      if (error) {
        alert("Erro ao atualizar posição: " + error.message);
      } else {
        alert("Posição atualizada com sucesso!");
        loadView('approved_levels');
      }
    }

    async function deleteLevel(id) {
      if (confirm("Deseja remover este nível?")) {
        await supabaseClient.from('levels').delete().eq('id', id);
        loadView(currentMode);
      }
    }

    async function approveRecord(id) {
      await supabaseClient.from('records').update({ status: 'approved' }).eq('id', id);
      loadView('pending_records');
    }

    async function deleteRecord(id) {
      if (confirm("Remover/rejeitar este record?")) {
        await supabaseClient.from('records').delete().eq('id', id);
        loadView(currentMode);
      }
    }
  </script>
</body>
</html>
