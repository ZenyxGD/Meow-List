<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow List - Levels</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --bg-color: #0b111e; 
      --card-bg: #131c2e; 
      --card-border: #1d2b45; 
      --text-main: #e2e8f0; 
      --accent-blue: #3b82f6; 
      --accent-green: #22c55e;
      --text-muted: #8493a8; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; }
    .nav-brand img { height: 38px; width: auto; border-radius: 6px; object-fit: contain; }
    .header-actions { display: flex; gap: 10px; }
    .btn-nav { background: var(--accent-blue); color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
    .btn-send { background: var(--accent-green); }

    .tabs { display: flex; gap: 10px; margin-bottom: 12px; width: 100%; max-width: 900px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .sub-tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 900px; justify-content: center; }
    .sub-tab-btn { padding: 8px 20px; background: #0b111e; border: 1px solid var(--card-border); color: var(--text-muted); font-weight: 600; font-size: 0.85rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .sub-tab-btn.active { background: #1e293b; color: var(--accent-blue); border-color: var(--accent-blue); }

    .list-container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; }
    
    .level-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; cursor: pointer; transition: background 0.2s; }
    .level-card:hover { background: #182339; }
    .level-card-header { display: flex; justify-content: space-between; align-items: center; }
    .level-title { font-size: 1.15rem; font-weight: bold; }

    .level-details-table { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 12px; cursor: default; }
    .meta-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
    .meta-col { display: flex; flex-direction: column; gap: 4px; }
    .meta-label { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
    .meta-val { font-size: 0.95rem; font-weight: 600; }
    .badge-nong { background: #9333ea; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; width: fit-content; }

    .showcase-container { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; margin-top: 5px; }
    .showcase-container iframe { width: 100%; height: 100%; border: none; }
    .showcase-fallback { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px; }

    .desc-box { background: #0b111e; border: 1px solid var(--card-border); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; color: #cbd5e1; white-space: pre-wrap; word-break: break-word; }
    .id-footer { font-size: 0.8rem; color: var(--text-muted); text-align: right; }

    .admin-actions { margin-top: 10px; display: flex; gap: 8px; justify-content: flex-end; }
    .btn-admin { background: #1e293b; border: 1px solid var(--card-border); color: var(--accent-blue); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    .btn-admin:hover { background: var(--card-border); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .modal-card input, .modal-card textarea { background: #0b111e; border: 1px solid var(--card-border); padding: 10px; border-radius: 6px; color: #fff; width: 100%; font-size: 0.9rem; outline: none; }
    .modal-card textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-save { background: var(--accent-green); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="nav-brand">
      <img src="https://raw.githubusercontent.com/LancerXDgmd/Meow-List/refs/heads/main/80%20Sem%20T%C3%ADtulo_20261017012315.png" alt="Meow List Banner">
    </a>
    <div class="header-actions">
      <a href="EnviarLevel.html" class="btn-nav btn-send"><i class="fa-solid fa-paper-plane"></i> Enviar Nível</a>
      <a href="AprovarLevel.html" class="btn-nav"><i class="fa-solid fa-shield-halved"></i> Moderação</a>
    </div>
  </header>

  <!-- ABAS DA LISTA -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('LPDM')">LPDM</button>
    <button class="tab-btn" onclick="switchTab('LIDM')">LIDM</button>
    <button class="tab-btn" onclick="switchTab('LLBDM')">LLBDM</button>
  </div>

  <!-- SUB-ABAS (CLÁSSICO / PLATAFORMA) -->
  <div class="sub-tabs">
    <button class="sub-tab-btn active" onclick="switchSubTab('classico')"><i class="fa-solid fa-cube"></i> Clássico</button>
    <button class="sub-tab-btn" onclick="switchSubTab('plataforma')"><i class="fa-solid fa-gamepad"></i> Plataforma</button>
  </div>

  <!-- CONTEÚDO DA LISTA -->
  <main class="list-container" id="listContainer">
    <p style="text-align: center; color: var(--text-muted);">Carregando níveis...</p>
  </main>

  <!-- MODAL DE EDIÇÃO ADMIN -->
  <div class="modal-overlay" id="editModal" style="display: none;">
    <div class="modal-card">
      <h3 style="color:#fff;"><i class="fa-solid fa-pen-to-square"></i> Editar Nível (Admin)</h3>
      <input type="hidden" id="editLevelId">
      
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Nome do Nível</label>
        <input type="text" id="editName">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Criador(es)</label>
        <input type="text" id="editCreator">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Verificador</label>
        <input type="text" id="editVerifier">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Link da Showcase (YouTube)</label>
        <input type="text" id="editShowcase">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Descrição</label>
        <textarea id="editDescription"></textarea>
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">ID GD</label>
        <input type="text" id="editGdId">
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
        <button class="btn-save" onclick="saveLevelEdit()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentCategory = 'LPDM';
    let currentSubTab = 'classico';
    let openLevelId = null;
    let isAdmin = false;
    let levelsDataCache = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAdminRole();
      loadCategoryList(currentCategory);
    });

    async function checkAdminRole() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { isAdmin = false; return; }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profile && profile.role === 'admin') {
        isAdmin = true;
      } else {
        isAdmin = false;
      }
    }

    function switchTab(cat) {
      currentCategory = cat;
      openLevelId = null;
      document.querySelectorAll('.tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadCategoryList(cat);
    }

    function switchSubTab(sub) {
      currentSubTab = sub;
      openLevelId = null;
      document.querySelectorAll('.sub-tabs .sub-tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function extractYouTubeEmbedUrl(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
    }

    async function loadCategoryList(cat) {
      const container = document.getElementById('listContainer');
      const { data: levels, error } = await supabaseClient
        .from('levels')
        .select('*')
        .eq('list_type', cat)
        .eq('meow_status', 'approved')
        .order('position', { ascending: true });

      if (error || !levels || levels.length === 0) {
        levelsDataCache = [];
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Nenhum nível aprovado nesta categoria ainda.</p>`;
        return;
      }

      levelsDataCache = levels;
      renderList();
    }

    function toggleLevelDetails(id) {
      if (openLevelId === id) {
        openLevelId = null;
      } else {
        openLevelId = id;
      }
      renderList();
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      const filteredLevels = levelsDataCache.filter(lvl => {
        const isPlat = (lvl.is_platformer === true || lvl.game_mode === 'plataforma');
        return currentSubTab === 'plataforma' ? isPlat : !isPlat;
      });

      if (filteredLevels.length === 0) {
        const modoTexto = currentSubTab === 'plataforma' ? 'de Plataforma' : 'Clássicos';
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Nenhum nível ${modoTexto} aprovado nesta categoria ainda.</p>`;
        return;
      }

      filteredLevels.forEach(lvl => {
        const isOpen = (openLevelId === lvl.id);

        let showcaseHtml = '';
        const rawShowcase = lvl.showcase_url || lvl.video_url;
        const embedUrl = extractYouTubeEmbedUrl(rawShowcase);

        if (embedUrl) {
          showcaseHtml = `
            <div class="showcase-container">
              <iframe src="${embedUrl}" allowfullscreen></iframe>
            </div>
          `;
        } else {
          showcaseHtml = `
            <div class="showcase-container">
              <div class="showcase-fallback">
                <i class="fa-solid fa-triangle-exclamation"></i> showcase não encontrada/não é do YouTube
              </div>
            </div>
          `;
        }

        const descriptionText = lvl.description ? lvl.description : "Sem descrição";

        let nongHtml = '';
        if (lvl.has_nong) {
          nongHtml = `
            <div class="badge-nong">
              <i class="fa-solid fa-music"></i> NONG: ${lvl.nong_name || 'Sim'}
            </div>
          `;
        }

        let detailsHtml = '';
        if (isOpen) {
          detailsHtml = `
            <div class="level-details-table" onclick="event.stopPropagation()">
              <div class="meta-row">
                <div class="meta-col">
                  <span class="meta-label">Criador(es)</span>
                  <span class="meta-val">${lvl.creator}</span>
                </div>
                <div class="meta-col" style="text-align: right;">
                  <span class="meta-label">Verificador</span>
                  <span class="meta-val">${lvl.verifier}</span>
                </div>
              </div>

              ${nongHtml}

              ${showcaseHtml}

              <div style="display:flex; flex-direction:column; gap:4px;">
                <span class="meta-label">Descrição</span>
                <div class="desc-box">${descriptionText}</div>
              </div>

              <div class="id-footer">
                ID GD: <strong>${lvl.gd_id}</strong>
              </div>

              ${isAdmin ? `
                <div class="admin-actions">
                  <button class="btn-admin" onclick="openEditModal('${lvl.id}')"><i class="fa-solid fa-pen"></i> Editar Level (Admin)</button>
                </div>
              ` : ''}
            </div>
          `;
        }

        container.innerHTML += `
          <div class="level-card" onclick="toggleLevelDetails('${lvl.id}')">
            <div class="level-card-header">
              <span class="level-title">#${lvl.position} - ${lvl.name}</span>
              <i class="fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'}" style="color: var(--text-muted);"></i>
            </div>
            ${detailsHtml}
          </div>
        `;
      });
    }

    function openEditModal(levelId) {
      const lvl = levelsDataCache.find(l => l.id === levelId);
      if (!lvl) return;

      document.getElementById('editLevelId').value = lvl.id;
      document.getElementById('editName').value = lvl.name || '';
      document.getElementById('editCreator').value = lvl.creator || '';
      document.getElementById('editVerifier').value = lvl.verifier || '';
      document.getElementById('editShowcase').value = lvl.showcase_url || lvl.video_url || '';
      document.getElementById('editDescription').value = lvl.description || '';
      document.getElementById('editGdId').value = lvl.gd_id || '';

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function saveLevelEdit() {
      if (!isAdmin) {
        alert("Apenas administradores podem realizar edições!");
        return;
      }

      const id = document.getElementById('editLevelId').value;
      const name = document.getElementById('editName').value.trim();
      const creator = document.getElementById('editCreator').value.trim();
      const verifier = document.getElementById('editVerifier').value.trim();
      const showcase = document.getElementById('editShowcase').value.trim();
      const description = document.getElementById('editDescription').value.trim() || null;
      const gdId = document.getElementById('editGdId').value.trim();

      const { error } = await supabaseClient
        .from('levels')
        .update({
          name: name,
          creator: creator,
          verifier: verifier,
          showcase_url: showcase,
          video_url: showcase,
          description: description,
          gd_id: gdId
        })
        .eq('id', id);

      if (error) {
        alert("Erro ao atualizar o nível: " + error.message);
      } else {
        alert("Nível atualizado com sucesso!");
        closeEditModal();
        loadCategoryList(currentCategory);
      }
    }
  </script>
</body>
</html>
