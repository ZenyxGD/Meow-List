<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats Viewer - Meow List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { 
      --bg-color: #0b111e; 
      --card-bg: #131c2e; 
      --card-border: #1d2b45; 
      --text-main: #e2e8f0; 
      --accent-blue: #3b82f6; 
      --text-muted: #8493a8; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    header { width: 100%; max-width: 850px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 15px; }
    header h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 8px; font-weight: bold; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }

    .search-box { width: 100%; max-width: 850px; margin-bottom: 20px; }
    .search-box input { width: 100%; padding: 12px; background: #0b111e; border: 1px solid var(--card-border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    .search-box input:focus { border-color: var(--accent-blue); }

    .stats-container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 14px; }
    .player-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .player-header { display: flex; justify-content: space-between; align-items: center; }
    .player-name { font-size: 1.15rem; font-weight: bold; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; }
    
    .records-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .record-item { background: #0b111e; border: 1px solid var(--card-border); padding: 12px 14px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
    .record-info { font-size: 0.95rem; word-break: break-word; }
    .record-details { color: var(--text-muted); font-size: 0.85rem; font-weight: normal; }
    .record-link { color: var(--accent-blue); text-decoration: none; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-chart-simple"></i> Stats Viewer</h1>
    <a href="index.html">← Voltar ao Início</a>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Pesquisar jogador..." oninput="filterPlayers()">
  </div>

  <main class="stats-container" id="statsContainer">
    <p style="text-align: center; color: var(--text-muted);">Carregando estatísticas...</p>
  </main>

  <script>
    const SUPABASE_URL = "https://cspsyzdohhprxoraudap.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzcHN5emRvaGhwcnhvcmF1ZGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjQ3NjEsImV4cCI6MjEwMzAwMDc2MX0.1uQOWMpovDiDFUIYbJ-1bovwc7OjGd4PauCm5U34dlE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPlayersData = [];

    document.addEventListener('DOMContentLoaded', loadStats);

    async function loadStats() {
      const container = document.getElementById('statsContainer');

      const { data: records, error } = await supabaseClient
        .from('records')
        .select('*, levels(name, creator, gd_id, list_type, is_platformer, game_mode)')
        .eq('status', 'approved');

      if (error || !records || records.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted);">Nenhum record/completion aprovado no momento.</p>`;
        return;
      }

      const playersMap = {};
      records.forEach(rec => {
        if (!playersMap[rec.player_name]) playersMap[rec.player_name] = [];
        playersMap[rec.player_name].push(rec);
      });

      allPlayersData = Object.keys(playersMap).map(name => ({
        name: name,
        records: playersMap[name]
      }));

      renderPlayers(allPlayersData);
    }

    function renderPlayers(players) {
      const container = document.getElementById('statsContainer');
      container.innerHTML = '';

      players.forEach(p => {
        let recordsHtml = '';
        p.records.forEach(r => {
          const lvlName = r.levels ? r.levels.name : 'Nível Removido';
          const creator = r.levels ? r.levels.creator : 'Desconhecido';
          const gdId = r.levels ? r.levels.gd_id : '?';
          const listType = r.levels ? (r.levels.list_type || 'LPDM') : 'LPDM';
          
          // Modo de jogo separado (Clássico, Plataforma ou Challenge)
          const mode = r.levels ? (r.levels.game_mode || (r.levels.is_platformer ? 'plataforma' : 'classico')) : 'classico';
          let gameModeName = 'Clássico';
          if (mode === 'plataforma') gameModeName = 'Plataforma';
          else if (mode === 'challenge') gameModeName = 'Challenge';

          let infoParts = [];
          infoParts.push(`<strong>${lvlName}</strong>`);
          infoParts.push(listType);
          infoParts.push(gameModeName);
          
          let pctText = `${r.progress}%`;
          if (r.is_practice) {
            pctText += ` Practice`;
          }
          infoParts.push(pctText);

          if (r.is_noclip) {
            if (r.noclip_deaths !== null && r.noclip_deaths !== undefined) {
              infoParts.push(`Mortes no noclip: ${r.noclip_deaths}`);
            }
            if (r.noclip_accuracy) {
              infoParts.push(`Noclip accuracy: ${r.noclip_accuracy}`);
            }
          }

          if (r.is_practice) {
            infoParts.push(`"Practice mode"`);
          }

          const recordLineText = infoParts.join(' • ');

          recordsHtml += `
            <li class="record-item">
              <div class="record-info">
                ${recordLineText}
                <span class="record-details">(Criador: ${creator} | ID:${gdId})</span>
              </div>
              <a href="${r.video_url}" target="_blank" class="record-link">
                <i class="fa-solid fa-play"></i> Ver Prova
              </a>
            </li>
          `;
        });

        container.innerHTML += `
          <div class="player-card">
            <div class="player-header">
              <span class="player-name"><i class="fa-solid fa-user"></i> ${p.name}</span>
              <span style="color:var(--text-muted); font-size:0.85rem;">${p.records.length} record(s)</span>
            </div>
            <ul class="records-list">
              ${recordsHtml}
            </ul>
          </div>
        `;
      });
    }

    function filterPlayers() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allPlayersData.filter(p => p.name.toLowerCase().includes(query));
      renderPlayers(filtered);
    }
  </script>
</body>
</html>
